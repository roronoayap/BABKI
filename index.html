<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Мій звіт</title>

<!-- Режим застосунку при додаванні на головний екран -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Мій звіт">
<meta name="theme-color" content="#101014">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#ebe8e1; --mute:#8f8d86; --line:#26262b; --bg:#101014; --gold:#e9b95c;
    --ip:#8ab4ff; --ip-soft:rgba(138,180,255,.14);
    --an:#ffc966; --an-soft:rgba(255,201,102,.14);
    --ra:#c9a0ff; --ra-soft:rgba(201,160,255,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(90% 50% at 50% 0%, #17161c 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
    font-feature-settings:'tnum' 1;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .container{max-width:490px; margin:0 auto; padding:26px 18px;}
  button{font-family:inherit; cursor:pointer; transition:opacity .12s, transform .06s, background .15s, color .15s, border-color .15s;}
  button:active{transform:scale(.97);}
  button:focus-visible, input:focus-visible{outline:2px solid #6f6a5c; outline-offset:2px;}

  /* Шапка */
  .header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px;}
  .eyebrow{color:var(--mute); font-size:13px; letter-spacing:.4px; margin-bottom:4px;}
  .title{font-size:22px; font-weight:700; letter-spacing:-.3px; font-family:'Space Grotesk',sans-serif;}
  .icon-btn{width:40px; height:40px; border-radius:12px; background:#1a1a1f; border:1px solid var(--line); color:var(--gold); font-size:16px; font-weight:700;}

  /* Налаштування */
  .settings{border:1px solid var(--line); border-radius:16px; padding:6px 16px; margin-bottom:18px; background:#16161a; display:none;}
  .settings.open{display:block;}
  .settings-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; gap:12px;}
  .settings-row .left{display:flex; align-items:center; gap:8px;}
  .rate-input{width:90px; text-align:right; background:#1d1d22; border:1px solid var(--line); border-radius:10px; padding:8px 10px; color:var(--ink); font-size:16px; font-weight:600; outline:none; font-family:inherit;}

  /* Головна картка */
  .hero{
    background:linear-gradient(150deg,#1c1a20 0%,#151419 60%,#141318 100%);
    border:1px solid #2b2a31; border-radius:22px; padding:20px 20px 16px;
    margin-bottom:14px; box-shadow:0 12px 40px rgba(0,0,0,.35);
    animation:rise .4s ease both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){.hero{animation:none;} .bar{transition:none !important;}}
  .hero-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .hero-label{color:var(--mute); font-size:13px; margin-bottom:6px;}
  .big-sum{font-size:42px; font-weight:700; letter-spacing:-1px; line-height:1; font-family:'Space Grotesk',sans-serif;}
  .big-sum .cur{font-size:24px; color:var(--gold); font-weight:500;}
  .today-pill{display:flex; flex-direction:column; align-items:flex-end; gap:2px; background:rgba(233,185,92,.08); border:1px solid rgba(233,185,92,.25); border-radius:12px; padding:8px 12px; white-space:nowrap;}
  .today-pill .cap{font-size:12px; color:#9a917d;}
  .today-pill .val{font-weight:700; color:var(--gold);}

  .chart{display:flex; align-items:flex-end; gap:5px; margin-top:18px; height:74px;}
  .chart .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; justify-content:flex-end;}
  .bar{width:100%; max-width:18px; border-radius:4px; transition:height .35s cubic-bezier(.2,.8,.2,1);}
  .bar-label{font-size:9.5px; font-weight:600; color:#55555c;}

  .type-split{display:flex; gap:16px; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid #232228; flex-wrap:wrap; font-size:14px;}
  .type-split .item{display:flex; align-items:center; gap:6px;}
  .type-split .item b{font-weight:700;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}
  .muted{color:var(--mute); font-size:14px;}

  /* Картки */
  .card{background:#15151a; border:1px solid #232228; border-radius:20px; padding:18px 18px 20px; margin-bottom:14px;}
  .section-label{font-size:11.5px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--mute); margin-bottom:14px; font-family:'Space Grotesk',sans-serif;}

  /* Сегмент типів */
  .segment{display:flex; background:#1c1c21; border:1px solid var(--line); border-radius:13px; padding:3px; margin-bottom:12px;}
  .segment button{flex:1; padding:9px 0; border-radius:10px; background:transparent; border:none; color:var(--mute); font-size:15px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:1px;}
  .segment button small{font-size:11px; opacity:.75; font-weight:600;}
  .segment button.active-IP{background:var(--ip-soft); color:var(--ip);}
  .segment button.active-Analog{background:var(--an-soft); color:var(--an);}
  .segment button.active-Radio{background:var(--ra-soft); color:var(--ra);}

  /* Чипи моделей */
  .models{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .chip{background:transparent; border:1px solid #35343b; border-radius:999px; padding:9px 15px; color:#cfccc4; font-size:14.5px; font-weight:500;}
  .chip.sel-IP{background:var(--ip-soft); border-color:var(--ip); color:var(--ip); font-weight:700;}
  .chip.sel-Analog{background:var(--an-soft); border-color:var(--an); color:var(--an); font-weight:700;}
  .chip.sel-Radio{background:var(--ra-soft); border-color:var(--ra); color:var(--ra); font-weight:700;}

  /* Кількість */
  .qty-row{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px;}
  .stepper{display:flex; align-items:center; background:#1c1c21; border:1px solid var(--line); border-radius:13px;}
  .stepper button{width:48px; height:48px; background:transparent; border:none; color:var(--ink); font-size:22px;}
  .qty-val{min-width:36px; text-align:center; font-size:19px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
  .calc{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
  .calc .sum{font-size:22px; font-weight:700; letter-spacing:-.3px; color:var(--gold); font-family:'Space Grotesk',sans-serif;}
  .calc .formula{color:var(--mute); font-size:13px;}

  /* Кнопка запису */
  .record-btn{width:100%; padding:16px 0; background:var(--gold); border:none; border-radius:14px; color:#1d1607; font-size:16px; font-weight:800; box-shadow:0 6px 24px rgba(233,185,92,.18);}
  .record-btn:disabled{opacity:.3; cursor:not-allowed; box-shadow:none;}
  .record-btn.flash{background:#f4d189;}

  /* Історія */
  .day{margin-bottom:20px;}
  .day-header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; padding-bottom:8px; border-bottom:1px solid #232228;}
  .day-date{font-size:15px; font-weight:700;}
  .day-sum{color:var(--mute); font-size:13px;}
  .day-sum b{color:#d8d5cd;}
  .rec{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid #1c1b21;}
  .rec-model{font-weight:600; font-size:14.5px; min-width:80px;}
  .rec-qty{flex:1; color:var(--mute); font-size:13.5px;}
  .rec-sum{font-weight:700; font-size:14.5px;}
  .del{background:transparent; border:none; color:#5a5a60; font-size:14px; padding:4px 2px 4px 8px; opacity:.55;}
  .empty{color:var(--mute); font-size:14px; line-height:1.5;}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <div class="title">Мій звіт</div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Ставки">₴</button>
  </div>

  <div class="settings" id="settings"></div>

  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="hero-label">Нараховано за місяць</div>
        <div class="big-sum"><span id="monthSum">0</span><span class="cur"> ₴</span></div>
      </div>
      <div class="today-pill">
        <span class="cap">сьогодні</span>
        <span class="val" id="todaySum">+0 ₴</span>
      </div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="type-split" id="typeSplit"></div>
  </div>

  <div class="card">
    <div class="section-label">Новий запис</div>
    <div class="segment" id="segment"></div>
    <div class="models" id="models"></div>
    <div class="qty-row">
      <div class="stepper">
        <button id="minus" aria-label="Менше">−</button>
        <div class="qty-val" id="qtyVal">1</div>
        <button id="plus" aria-label="Більше">+</button>
      </div>
      <div class="calc">
        <span class="formula" id="formula"></span>
        <span class="sum" id="calcSum"></span>
      </div>
    </div>
    <button class="record-btn" id="recordBtn" disabled>Оберіть модель</button>
  </div>

  <div class="card">
    <div class="section-label">Історія</div>
    <div id="history"></div>
  </div>

  <div style="height:36px"></div>
</div>

<script>
// ─── Дані ─────────────────────────────────────────────────────
const STORAGE_KEY = "zp-tracker-v1";
const DEFAULT_RATES = { IP: 450, Analog: 350, Radio: 350 };
const TYPES = ["IP", "Analog", "Radio"];
const MODELS = {
  IP: ["IP 10/15","IP 10/20","IP 13/23","IP 13/20","IP 15/30"],
  Analog: ["A 10/15","A 10/20","A 13/15","A 13/20","A 13/23","A 15/30"],
  Radio: ["R 7 Plus","R 9 Ultra","R 10","R 13","R 15"],
};
const HUE = { IP:"var(--ip)", Analog:"var(--an)", Radio:"var(--ra)" };
const MONTHS = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const MONTHS_NOM = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];

let records = [];
let rates = { ...DEFAULT_RATES };
let selType = "IP";
let selModel = null;
let qty = 1;

// ─── Утиліти ──────────────────────────────────────────────────
const fmt = n => n.toLocaleString("uk-UA").replace(/,/g," ");
const pad = n => String(n).padStart(2,"0");
const dateKeyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dateKeyOf(new Date());
const monthKey = s => s.slice(0,7);
const prettyDate = s => { const [,m,d] = s.split("-").map(Number); return `${d} ${MONTHS[m-1]}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      records = data.records || [];
      rates = { ...DEFAULT_RATES, ...(data.rates||{}) };
    }
  }catch(e){}
}
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({records, rates})); }catch(e){}
}

// ─── Рендер ───────────────────────────────────────────────────
function renderAll(){
  const now = new Date();
  document.getElementById("eyebrow").textContent = `${MONTHS_NOM[now.getMonth()]} ${now.getFullYear()}`;
  renderStats(); renderChart(); renderSegment(); renderModels(); renderQty(); renderHistory(); renderSettings();
}

function renderStats(){
  const now = new Date();
  const curMonth = `${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const tk = todayKey();
  let monthSum=0, monthCount=0, todaySum=0;
  const byType = { IP:0, Analog:0, Radio:0 };
  for(const r of records){
    const amount = r.qty * (r.rate ?? rates[r.type] ?? 0);
    if(monthKey(r.date) === curMonth){ monthSum += amount; monthCount += r.qty; byType[r.type] = (byType[r.type]||0)+r.qty; }
    if(r.date === tk) todaySum += amount;
  }
  document.getElementById("monthSum").textContent = fmt(monthSum);
  document.getElementById("todaySum").textContent = `+${fmt(todaySum)} ₴`;
  document.getElementById("typeSplit").innerHTML =
    TYPES.map(t => `<span class="item"><span class="dot" style="background:${HUE[t]}"></span><span class="muted">${t}</span><b>${byType[t]||0}</b></span>`).join("") +
    `<span class="item" style="margin-left:auto"><span class="muted">разом</span><b>${monthCount} шт</b></span>`;
}

function renderChart(){
  const days = [];
  for(let i=13;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push({key:dateKeyOf(d), sum:0, label:d.getDate()}); }
  const map = Object.fromEntries(days.map(d=>[d.key,d]));
  for(const r of records){ if(map[r.date]) map[r.date].sum += r.qty*(r.rate??0); }
  const max = Math.max(...days.map(d=>d.sum),1);
  const tk = todayKey();
  document.getElementById("chart").innerHTML = days.map(d=>{
    const h = Math.max(Math.round(d.sum/max*56),3);
    const color = d.key===tk ? "var(--gold)" : d.sum>0 ? "#5d5749" : "#26262b";
    const labelColor = d.key===tk ? "var(--gold)" : "#55555c";
    return `<div class="col" title="${prettyDate(d.key)}: ${fmt(d.sum)} ₴">
      <div class="bar" style="height:${h}px;background:${color}"></div>
      <div class="bar-label" style="color:${labelColor}">${d.label}</div>
    </div>`;
  }).join("");
}

function renderSegment(){
  document.getElementById("segment").innerHTML = TYPES.map(t =>
    `<button data-type="${t}" class="${selType===t ? "active-"+t : ""}">${t}<small>${rates[t]} ₴</small></button>`
  ).join("");
  document.querySelectorAll("#segment button").forEach(b =>
    b.onclick = () => { selType = b.dataset.type; selModel = null; renderSegment(); renderModels(); renderQty(); }
  );
}

function renderModels(){
  document.getElementById("models").innerHTML = MODELS[selType].map(m =>
    `<button data-model="${esc(m)}" class="chip ${selModel===m ? "sel-"+selType : ""}">${esc(m)}</button>`
  ).join("");
  document.querySelectorAll("#models .chip").forEach(b =>
    b.onclick = () => { selModel = selModel===b.dataset.model ? null : b.dataset.model; renderModels(); renderQty(); }
  );
}

function renderQty(){
  document.getElementById("qtyVal").textContent = qty;
  document.getElementById("formula").textContent = `${qty} × ${rates[selType]} ₴`;
  document.getElementById("calcSum").textContent = `${fmt(qty*rates[selType])} ₴`;
  const btn = document.getElementById("recordBtn");
  btn.disabled = !selModel;
  btn.textContent = selModel ? `Записати · ${selModel}` : "Оберіть модель";
  btn.classList.remove("flash");
}

function renderHistory(){
  const map = {};
  for(const r of records) (map[r.date] ||= []).push(r);
  const grouped = Object.entries(map).sort((a,b)=> a[0]<b[0]?1:-1);
  const el = document.getElementById("history");
  if(!grouped.length){
    el.innerHTML = `<div class="empty">Поки порожньо. Зроби перший запис — і графік зверху почне оживати.</div>`;
    return;
  }
  el.innerHTML = grouped.map(([date, recs])=>{
    const daySum = recs.reduce((s,r)=>s+r.qty*(r.rate??0),0);
    const dayQty = recs.reduce((s,r)=>s+r.qty,0);
    const rows = recs.map(r=>`
      <div class="rec">
        <span class="dot" style="background:${HUE[r.type]||"#777"}"></span>
        <span class="rec-model">${esc(r.model||r.type)}</span>
        <span class="rec-qty">${r.qty} × ${r.rate} ₴</span>
        <span class="rec-sum">${fmt(r.qty*r.rate)} ₴</span>
        <button class="del" data-id="${r.id}" aria-label="Видалити">✕</button>
      </div>`).join("");
    return `<div class="day">
      <div class="day-header">
        <span class="day-date">${date===todayKey() ? "Сьогодні" : prettyDate(date)}</span>
        <span class="day-sum">${dayQty} шт · <b>${fmt(daySum)} ₴</b></span>
      </div>${rows}</div>`;
  }).join("");
  el.querySelectorAll(".del").forEach(b =>
    b.onclick = () => {
      records = records.filter(r => r.id !== b.dataset.id);
      persist(); renderStats(); renderChart(); renderHistory();
    }
  );
}

function renderSettings(){
  document.getElementById("settings").innerHTML = TYPES.map(t=>`
    <div class="settings-row">
      <span class="left"><span class="dot" style="background:${HUE[t]}"></span><span class="muted">${t}, за дрон</span></span>
      <input class="rate-input" type="number" inputmode="numeric" data-type="${t}" value="${rates[t]}">
    </div>`).join("");
  document.querySelectorAll("#settings .rate-input").forEach(inp =>
    inp.oninput = () => {
      rates[inp.dataset.type] = Math.max(0, Number(inp.value)||0);
      persist(); renderStats(); renderSegment(); renderQty();
    }
  );
}

// ─── Дії ──────────────────────────────────────────────────────
document.getElementById("minus").onclick = () => { qty = Math.max(1, qty-1); renderQty(); };
document.getElementById("plus").onclick = () => { qty++; renderQty(); };
document.getElementById("settingsBtn").onclick = () => {
  const s = document.getElementById("settings");
  s.classList.toggle("open");
  document.getElementById("settingsBtn").textContent = s.classList.contains("open") ? "✕" : "₴";
};
document.getElementById("recordBtn").onclick = () => {
  if(!selModel || qty<1) return;
  records.unshift({
    id: Date.now()+"-"+Math.random().toString(36).slice(2,6),
    date: todayKey(), type: selType, model: selModel, qty, rate: rates[selType],
  });
  persist();
  qty = 1;
  renderStats(); renderChart(); renderHistory(); renderQty();
  const btn = document.getElementById("recordBtn");
  btn.textContent = "Записано ✓"; btn.classList.add("flash");
  setTimeout(renderQty, 1100);
};

// ─── Старт ────────────────────────────────────────────────────
load();
renderAll();
</script>
</body>
</html>
